<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行動化驗屋與修繕追蹤系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF 匯出核心套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .draggable-col {
            cursor: grab;
        }
        .draggable-col:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased" x-data="inspectionApp()">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Mobile Sidebar Toggle Button -->
        <button @click="mobileSidebarOpen = !mobileSidebarOpen" class="md:hidden fixed bottom-6 right-6 z-50 w-14 h-14 bg-blue-600 text-white rounded-full shadow-2xl flex items-center justify-center text-xl transition hover:bg-blue-700">
            <i class="fa-solid" :class="mobileSidebarOpen ? 'fa-xmark' : 'fa-bars'"></i>
        </button>

        <!-- Left Sidebar -->
        <aside :class="mobileSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'" class="fixed md:static inset-y-0 left-0 w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shadow-xl z-40 transition-transform duration-300 ease-in-out">
            <div>
                <!-- Brand / Logo -->
                <div class="px-6 py-5 border-b border-slate-800 flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-lg shadow-md">
                        <i class="fa-solid fa-house-chimney-user"></i>
                    </div>
                    <div>
                        <h2 class="text-white font-bold text-sm tracking-wide truncate max-w-[130px]" x-text="currentProjectName"></h2>
                        <span class="text-[11px] text-blue-400 font-medium">智慧化驗屋系統 v3.2</span>
                    </div>
                </div>

                <!-- Navigation Links -->
                <nav class="p-4 space-y-1.5 text-sm">
                    <a href="#" @click.prevent="activeTab = 'inspection'; mobileSidebarOpen = false" class="flex items-center justify-between px-3.5 py-2.5 rounded-lg transition" :class="activeTab === 'inspection' ? 'bg-blue-600 text-white font-medium shadow-sm' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-clipboard-list w-5 text-center"></i>
                            <span>自主驗屋初驗清單</span>
                        </div>
                        <span class="text-xs px-2 py-0.5 rounded-full font-bold" :class="activeTab === 'inspection' ? 'bg-blue-700 text-white' : 'bg-slate-800 text-slate-300'" x-text="items.length"></span>
                    </a>
                    
                    <a href="#" @click.prevent="activeTab = 'projects'; mobileSidebarOpen = false" class="flex items-center justify-between px-3.5 py-2.5 rounded-lg transition" :class="activeTab === 'projects' ? 'bg-blue-600 text-white font-medium shadow-sm' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-folder-open w-5 text-center"></i>
                            <span>專案清單管理</span>
                        </div>
                        <span class="text-xs px-2 py-0.5 rounded-full font-bold" :class="activeTab === 'projects' ? 'bg-blue-700 text-white' : 'bg-slate-800 text-slate-300'" x-text="projects.length"></span>
                    </a>

                    <a href="#" @click.prevent="activeTab = 'analytics'; mobileSidebarOpen = false" class="flex items-center justify-between px-3.5 py-2.5 rounded-lg transition" :class="activeTab === 'analytics' ? 'bg-blue-600 text-white font-medium shadow-sm' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-chart-pie w-5 text-center"></i>
                            <span>修繕數據統計</span>
                        </div>
                    </a>
                    <a href="#" @click.prevent="checkSettingsAccess(); mobileSidebarOpen = false" class="flex items-center justify-between px-3.5 py-2.5 rounded-lg transition" :class="activeTab === 'settings' ? 'bg-blue-600 text-white font-medium shadow-sm' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-gear w-5 text-center"></i>
                            <span>系統參數設定</span>
                        </div>
                    </a>
                </nav>
            </div>

            <div class="p-4 border-t border-slate-800 bg-slate-950/40 text-xs space-y-2">
                <div class="flex items-center justify-between text-slate-400">
                    <span>當前模擬身份</span>
                    <span class="text-emerald-400 font-semibold" x-text="currentRoleName()"></span>
                </div>
                <p class="text-[11px] text-slate-500">提示：未正確輸入密碼將自動切換為純觀看者模式。</p>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-3">
                    
                    <div class="flex items-center space-x-3">
                        <div class="md:hidden w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">
                            <i class="fa-solid fa-house-chimney-user"></i>
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h1 class="text-lg font-bold text-slate-800 tracking-tight" x-text="currentProjectName"></h1>
                                <template x-if="hasPermission('edit')">
                                    <button @click="openEditProjectModal()" class="text-xs text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-2 py-0.5 rounded transition font-medium">
                                        <i class="fa-solid fa-pen-to-square mr-1"></i>變更名稱
                                    </button>
                                </template>
                            </div>
                            <p class="text-xs text-slate-500">當前檢驗戶別：<span class="font-semibold text-blue-600" x-text="selectedUnitFilter || '全部戶別'"></span></p>
                        </div>
                    </div>

                    <div class="flex items-center space-x-3">
                        <div class="flex items-center space-x-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg text-xs">
                            <span class="text-slate-500 font-medium"><i class="fa-solid fa-user-shield mr-1"></i>權限角色：</span>
                            <select :value="currentRole" @change="onRoleSelectChange($event)" class="bg-transparent font-bold text-blue-600 focus:outline-none cursor-pointer">
                                <option value="Owner">最高權限 (Owner)</option>
                                <option value="Inspector" x-text="customInspectors[0] ? (customInspectors[0].name + ' (' + customInspectors[0].title + ')') : '驗屋人員'"></option>
                                <template x-for="insp in customInspectors.slice(1)" :key="insp.id">
                                    <option :value="'CustomInspector_' + insp.id" x-text="insp.name + ' (' + insp.title + ')'"></option>
                                </template>
                                <option value="Vendor" x-text="customVendors[0] ? (customVendors[0].name + ' (' + customVendors[0].title + ')') : '廠商'"></option>
                                <template x-for="ven in customVendors.slice(1)" :key="ven.id">
                                    <option :value="'CustomVendor_' + ven.id" x-text="ven.name + ' (' + ven.title + ')'"></option>
                                </template>
                                <option value="Admin" x-text="customAdmins[0] ? (customAdmins[0].name + ' (' + customAdmins[0].title + ')') : '工務/管理員'"></option>
                                <template x-for="adm in customAdmins.slice(1)" :key="adm.id">
                                    <option :value="'CustomAdmin_' + adm.id" x-text="adm.name + ' (' + adm.title + ')'"></option>
                                </template>
                                <option value="Viewer">純觀看者 (Viewer)</option>
                            </select>
                        </div>

                        <!-- 📄 [新增] 匯出 PDF 按鈕 -->
                        <button @click="openPdfExportModal()" class="bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center space-x-1.5 shadow-sm">
                            <i class="fa-solid fa-file-pdf"></i>
                            <span>匯出 PDF 報告</span>
                        </button>

                        <template x-if="hasPermission('create')">
                            <button @click="openNewItemModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center space-x-2 shadow-sm">
                                <i class="fa-solid fa-plus"></i>
                                <span>新增驗屋缺失項目</span>
                            </button>
                        </template>

                        <template x-if="hasPermission('create')">
                            <button @click="openCreateProjectModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center space-x-1.5 shadow-sm" title="建立全新專案">
                                <i class="fa-solid fa-folder-plus"></i>
                                <span class="hidden sm:inline">新專案</span>
                            </button>
                        </template>
                    </div>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">

                <!-- 專案清單管理 Tab 畫面 -->
                <template x-if="activeTab === 'projects'">
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-100">
                                <div>
                                    <h2 class="text-lg font-bold text-slate-800 flex items-center space-x-2">
                                        <i class="fa-solid fa-folder-open text-blue-600"></i>
                                        <span>專案清單與切換管理</span>
                                    </h2>
                                    <p class="text-xs text-slate-500 mt-1">您可在此透過下拉選單或專案列表，快速切換與管理所有已新增的新專案項目內容。</p>
                                </div>
                                <template x-if="hasPermission('create')">
                                    <button @click="openCreateProjectModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2 shadow-sm">
                                        <i class="fa-solid fa-folder-plus"></i>
                                        <span>建立全新專案</span>
                                    </button>
                                </template>
                            </div>

                            <div class="py-6 grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                                <div class="space-y-2">
                                    <label class="block text-sm font-semibold text-slate-700">選擇要切換或管理的專案項目：</label>
                                    <div class="flex items-center space-x-3">
                                        <div class="relative flex-1">
                                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                                <i class="fa-solid fa-bars-progress"></i>
                                            </span>
                                            <select x-model="selectedProjectId" @change="switchProjectById(selectedProjectId)" class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl bg-slate-50 text-slate-800 font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-xs">
                                                <template x-for="p in projects" :key="p.id">
                                                    <option :value="p.id" x-text="p.name + ' (' + (p.items ? p.items.length : 0) + ' 筆缺失)'"></option>
                                                </template>
                                            </select>
                                        </div>
                                        <button @click="activeTab = 'inspection'" class="px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold transition shadow-sm flex items-center space-x-2">
                                            <i class="fa-solid fa-arrow-right-to-bracket"></i>
                                            <span>進入檢視清單</span>
                                        </button>
                                    </div>
                                </div>

                                <div class="bg-blue-50/60 border border-blue-100 rounded-2xl p-4 flex items-center space-x-4">
                                    <div class="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center text-2xl shadow-md shrink-0">
                                        <i class="fa-solid fa-building-shield"></i>
                                    </div>
                                    <div>
                                        <span class="text-xs text-blue-600 font-bold">目前作用中專案</span>
                                        <h4 class="text-base font-bold text-slate-800" x-text="currentProjectName"></h4>
                                        <p class="text-xs text-slate-500 mt-0.5">包含項目總數：<span class="font-semibold text-slate-700" x-text="items.length"></span> 筆</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                                <h3 class="font-bold text-slate-800 text-sm">所有已新增專案總覽</h3>
                                <span class="text-xs text-slate-500">共計 <span class="font-bold text-slate-700" x-text="projects.length"></span> 個專案</span>
                            </div>
                            <div class="divide-y divide-slate-100">
                                <template x-for="proj in projects" :key="proj.id">
                                    <div class="p-4 sm:p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:bg-slate-50/70 transition">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center font-bold">
                                                <i class="fa-solid fa-folder"></i>
                                            </div>
                                            <div>
                                                <div class="flex items-center space-x-2">
                                                    <h4 class="font-bold text-slate-800 text-base" x-text="proj.name"></h4>
                                                    <template x-if="proj.name === currentProjectName">
                                                        <span class="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-0.5 rounded-full font-bold">當前使用中</span>
                                                    </template>
                                                </div>
                                                <p class="text-xs text-slate-500 mt-0.5">專案編號 ID: <span class="font-mono" x-text="proj.id"></span> ｜ 檢驗缺失項目數：<span class="font-semibold text-slate-700" x-text="proj.items ? proj.items.length : 0"></span> 筆</p>
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                                            <button @click="switchProjectById(proj.id); activeTab = 'inspection'" class="px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-xs font-semibold transition">
                                                <i class="fa-solid fa-eye mr-1"></i>切換檢視
                                            </button>
                                            <template x-if="hasPermission('delete')">
                                                <button @click="deleteProject(proj.id)" class="px-3 py-1.5 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg text-xs font-semibold transition" :disabled="projects.length <= 1">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- 自主驗屋初驗清單 Tab 畫面 -->
                <template x-if="activeTab === 'inspection'">
                    <div class="space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                                <div>
                                    <p class="text-xs text-slate-500 font-medium">總檢驗項目</p>
                                    <h3 class="text-2xl font-bold text-slate-800 mt-1" x-text="filteredItems.length"></h3>
                                </div>
                                <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
                                    <i class="fa-solid fa-clipboard-list"></i>
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                                <div>
                                    <p class="text-xs text-slate-500 font-medium">待修繕缺失</p>
                                    <h3 class="text-2xl font-bold text-amber-600 mt-1" x-text="filteredItems.filter(i => i.repairStatus === '待修繕').length"></h3>
                                </div>
                                <div class="w-10 h-10 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center text-lg">
                                    <i class="fa-solid fa-clock-rotate-left"></i>
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                                <div>
                                    <p class="text-xs text-slate-500 font-medium">修繕中</p>
                                    <h3 class="text-2xl font-bold text-blue-600 mt-1" x-text="filteredItems.filter(i => i.repairStatus === '修繕中').length"></h3>
                                </div>
                                <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
                                    <i class="fa-solid fa-screwdriver-wrench"></i>
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                                <div>
                                    <p class="text-xs text-slate-500 font-medium">已完成驗收</p>
                                    <h3 class="text-2xl font-bold text-emerald-600 mt-1" x-text="filteredItems.filter(i => i.repairStatus === '已完成').length"></h3>
                                </div>
                                <div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg">
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                            </div>
                        </div>

                        <!-- 批量操作面板 -->
                        <template x-if="batchMode">
                            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex flex-wrap justify-between items-center gap-4 transition shadow-sm">
                                <div class="flex items-center space-x-3">
                                    <span class="bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded-md" x-text="'已選取 ' + selectedItemIds.length + ' 項'"></span>
                                    <button @click="toggleSelectAll()" class="text-xs text-blue-700 hover:underline font-semibold" x-text="selectedItemIds.length === filteredItems.length ? '取消全選' : '全選所有項目'"></button>
                                </div>
                                <div class="flex flex-wrap items-center gap-2">
                                    <select x-model="batchTargetSpace" class="text-xs border rounded-lg px-2.5 py-1.5 bg-white">
                                        <option value="">批次修改空間...</option>
                                        <template x-for="s in spaceOptions" :key="s"><option :value="s" x-text="s"></option></template>
                                    </select>
                                    <button @click="applyBatchSpace()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium">套用空間</button>
                                    
                                    <select x-model="batchTargetStatus" class="text-xs border rounded-lg px-2.5 py-1.5 bg-white">
                                        <option value="">批次修繕狀態...</option>
                                        <option value="待修繕">待修繕</option>
                                        <option value="修繕中">修繕中</option>
                                        <option value="已完成">已完成</option>
                                    </select>
                                    <button @click="applyBatchStatus()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium">套用狀態</button>

                                    <template x-if="hasPermission('delete')">
                                        <button @click="deleteBatchItems()" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-medium flex items-center space-x-1">
                                            <i class="fa-solid fa-trash-can"></i><span>批量刪除</span>
                                        </button>
                                    </template>
                                    <button @click="exitBatchMode()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-medium">退出多選</button>
                                </div>
                            </div>
                        </template>

                        <!-- 搜尋、多條件篩選與模式切換 -->
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col lg:flex-row justify-between items-center gap-4">
                            <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                                <div class="relative w-full sm:w-56">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                        <i class="fa-solid fa-magnifying-glass"></i>
                                    </span>
                                    <input type="text" x-model="searchQuery" placeholder="搜尋項目、備註..." class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                                
                                <select x-model="selectedSpaceFilter" class="border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">所有空間</option>
                                    <template x-for="space in spaceOptions" :key="space">
                                        <option :value="space" x-text="space"></option>
                                    </template>
                                </select>

                                <select x-model="selectedCategoryFilter" class="border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">所有類別／工種</option>
                                    <template x-for="cat in categoryOptions" :key="cat">
                                        <option :value="cat" x-text="cat"></option>
                                    </template>
                                </select>

                                <select x-model="selectedUnitFilter" class="border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">所有戶別</option>
                                    <template x-for="unit in unitOptions" :key="unit">
                                        <option :value="unit" x-text="unit"></option>
                                    </template>
                                </select>

                                <select x-model="filterStatus" class="border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="">所有修繕狀態</option>
                                    <option value="待修繕">待修繕</option>
                                    <option value="修繕中">修繕中</option>
                                    <option value="已完成">已完成</option>
                                </select>

    <!-- 📄 [新增] PDF 報告公版隱藏渲染模板 (#pdf-export-template) -->

            <!-- 標題區塊 -->

            <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; border: 1px solid #cbd5e1;">
                <tr>
                    <td style="padding: 8px 12px; border: 1px solid #cbd5e1; background: #f8fafc; font-weight: bold; width: 15%; color: #334155;">委託人</td>
                    <td style="padding: 8px 12px; border: 1px solid #cbd5e1; width: 35%;" x-text="pdfForm.client || '【】'"></td>
                    <td style="padding: 8px 12px; border: 1px solid #cbd5e1; background: #f8fafc; font-weight: bold; width: 15%; color: #334155;">建案</td>
                    <td style="padding: 8px 12px; border: 1px solid #cbd5e1; width: 35%;" x-text="pdfForm.projectName || '【】'"></td>
                </tr>
                <tr>
                    <td style="padding: 8px 12px; border: 1px solid #cbd5e1; background: #f8fafc; font-weight: bold; color: #334155;">標的物地址</td>
                    <td style="padding: 8px 12px; border: 1px solid #cbd5e1;" x-text="pdfForm.address || '【】'"></td>
                    <td style="padding: 8px 12px; border: 1px solid #cbd5e1; background: #f8fafc; font-weight: bold; color: #334155;">備註</td>
                    <td style="padding: 8px 12px; border: 1px solid #cbd5e1;" x-text="pdfForm.remark || '【】'"></td>
                </tr>
            </table>

            <!-- 公版次標題 -->
            <div style="font-size: 15px; font-weight: bold; padding: 8px 12px; background-color: #1e293b; color: #ffffff; margin-bottom: 16px; border-radius: 4px; tracking-wide: 1px;">

            <!-- 缺失項目卡片循環渲染 -->
            <template x-for="(item, idx) in filteredItems" :key="item.id">
                <div style="border: 1.5px solid #475569; margin-bottom: 18px; page-break-inside: avoid; border-radius: 6px; overflow: hidden; background: #ffffff;">
                    <!-- 類別 / 檢測區域 / 缺失說明 -->
                    <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                        <tr style="background: #f1f5f9; border-bottom: 1px solid #cbd5e1;">
                            <td style="padding: 8px 12px; width: 15%; font-weight: bold; border-right: 1px solid #cbd5e1; color: #334155;">類別</td>
                            <td style="padding: 8px 12px; width: 35%; border-right: 1px solid #cbd5e1; font-weight: 500;" x-text="item.category"></td>
                            <td style="padding: 8px 12px; width: 15%; font-weight: bold; border-right: 1px solid #cbd5e1; color: #334155;">檢測區域</td>
                            <td style="padding: 8px 12px; width: 35%; font-weight: bold; color: #2563eb;" x-text="(item.unit || '') + ' ' + (item.space || '')"></td>
                        </tr>
                        <tr style="border-bottom: 1px solid #cbd5e1;">

                            <td style="padding: 8px 12px;" colspan="3" x-text="item.name + (item.remark ? '（' + item.remark + '）' : '')"></td>

                    <div style="padding: 10px; border-bottom: 1px solid #cbd5e1; background: #fafafa;">

                                        </template>
                                        <template x-if="getPhotosByType(item, pType).length === 0">

                </div>
            </template>

                        let matchQuery = !this.searchQuery || item.name.includes(this.searchQuery) || (item.remark && item.remark.includes(this.searchQuery)) || item.code.includes(this.searchQuery);
                        let matchSpace = !this.selectedSpaceFilter || item.space === this.selectedSpaceFilter;
                        let matchCategory = !this.selectedCategoryFilter || item.category === this.selectedCategoryFilter;
                        let matchUnit = !this.selectedUnitFilter || item.unit === this.selectedUnitFilter;
                        let matchStatus = !this.filterStatus || item.repairStatus === this.filterStatus;
                        let matchInsp = !this.filterInspectionStatus || item.inspectionStatus === this.filterInspectionStatus;
                        return matchQuery && matchSpace && matchCategory && matchUnit && matchStatus && matchInsp;
                    });
                },

                get spaceOptions() { return [...new Set(this.items.map(i => i.space))].filter(Boolean); },
                get categoryOptions() { return [...new Set(this.items.map(i => i.category))].filter(Boolean); },
                get unitOptions() { return [...new Set(this.items.map(i => i.unit))].filter(Boolean); },

                    return this.projects.find(p => p.id === this.analyticsProjectId) || this.projects[0];

                get analyticsSpaceList() { return [...new Set((this.analyticsCurrentProject.items || []).map(i => i.space))].filter(Boolean); },

                        let matchSpace = !this.analyticsSpace || item.space === this.analyticsSpace;
                        let matchUnit = !this.analyticsUnit || item.unit === this.analyticsUnit;
                        let matchCategory = !this.analyticsCategory || item.category === this.analyticsCategory;
                        return matchSpace && matchUnit && matchCategory;
                    });

                get analyticsCompletedCount() {
                    return this.analyticsFilteredItems.filter(i => i.repairStatus === '已完成').length;

                    let total = this.analyticsFilteredItems.length;
                    if (total === 0) return 0;
                    return Math.round((this.analyticsCompletedCount / total) * 100);

                    if (this.currentRole === 'Owner') return true;
                    if (this.currentRole === 'Viewer') return false;
                    if (action === 'edit' || action === 'upload') return true;
                    if (action === 'create' || action === 'delete') {
                        return this.currentRole.includes('Admin') || this.currentRole === 'Admin';

                    return false;

                    if (target === 'Owner') {
                        this.targetRoleToSwitch = 'Owner';
                        this.passwordPromptTitle = '請輸入最高權限者 (Owner) 密碼';
                        this.enteredPassword = '';
                        this.showPasswordModalFlag = true;
                    } else if (target.startsWith('CustomInspector_') || target === 'Inspector') {
                        let id = target === 'Inspector' ? (this.customInspectors[0]?.id) : target.replace('CustomInspector_', '');
                        let obj = this.customInspectors.find(i => i.id === id);
                        this.targetRoleToSwitch = target;
                        this.passwordPromptTitle = `請輸入驗屋人員 [${obj?.name || ''}] 的密碼`;
                        this.enteredPassword = '';
                        this.showPasswordModalFlag = true;
                    } else if (target.startsWith('CustomVendor_') || target === 'Vendor') {
                        let id = target === 'Vendor' ? (this.customVendors[0]?.id) : target.replace('CustomVendor_', '');
                        let obj = this.customVendors.find(v => v.id === id);
                        this.targetRoleToSwitch = target;
                        this.passwordPromptTitle = `請輸入廠商 [${obj?.name || ''}] 的密碼`;
                        this.enteredPassword = '';
                        this.showPasswordModalFlag = true;
                    } else if (target.startsWith('CustomAdmin_') || target === 'Admin') {
                        let id = target === 'Admin' ? (this.customAdmins[0]?.id) : target.replace('CustomAdmin_', '');
                        let obj = this.customAdmins.find(a => a.id === id);
                        this.targetRoleToSwitch = target;
                        this.passwordPromptTitle = `請輸入工務/管理員 [${obj?.name || ''}] 的密碼`;
                        this.enteredPassword = '';
                        this.showPasswordModalFlag = true;
                    } else {
                        this.currentRole = target;
                    }
                },

                verifyPassword() {
                    let reqPwd = '';
                    if (this.targetRoleToSwitch === 'Owner') {
                        reqPwd = this.ownerPassword;
                    } else if (this.targetRoleToSwitch.includes('Inspector')) {
                        let id = this.targetRoleToSwitch === 'Inspector' ? this.customInspectors[0]?.id : this.targetRoleToSwitch.replace('CustomInspector_', '');
                        let obj = this.customInspectors.find(i => i.id === id);
                        reqPwd = obj ? obj.password : '0000';
                    } else if (this.targetRoleToSwitch.includes('Vendor')) {
                        let id = this.targetRoleToSwitch === 'Vendor' ? this.customVendors[0]?.id : this.targetRoleToSwitch.replace('CustomVendor_', '');
                        let obj = this.customVendors.find(v => v.id === id);
                        reqPwd = obj ? obj.password : '0000';
                    } else if (this.targetRoleToSwitch.includes('Admin')) {
                        let id = this.targetRoleToSwitch === 'Admin' ? this.customAdmins[0]?.id : this.targetRoleToSwitch.replace('CustomAdmin_', '');
                        let obj = this.customAdmins.find(a => a.id === id);
                        reqPwd = obj ? obj.password : '0000';
                    }

                    if (this.enteredPassword === reqPwd) {
                        this.currentRole = this.targetRoleToSwitch;
                        this.showPasswordModalFlag = false;
                    } else {
                        alert('密碼錯誤！系統將自動切換為【純觀看者 Mode】。');
                        this.currentRole = 'Viewer';
                        this.showPasswordModalFlag = false;
                    }
                },

                cancelPasswordModal() {
                    this.showPasswordModalFlag = false;
                },

                switchProjectById(id) {
                    this.selectedProjectId = id;
                    let p = this.projects.find(x => x.id === id);
                    if (p) this.currentProjectName = p.name;
                    this.analyticsProjectId = id;
                },

                switchAnalyticsProject(id) {
                    this.analyticsProjectId = id;
                    this.analyticsSpace = '';
                    this.analyticsUnit = '';
                    this.analyticsCategory = '';
                },

                openCreateProjectModal() {
                    this.newProjectName = '';
                    this.showCreateProjectModalFlag = true;
                },

                createNewProject() {
                    if (!this.newProjectName.trim()) { alert('請輸入專案名稱'); return; }
                    let newId = 'proj_' + Date.now();
                    let newProj = { id: newId, name: this.newProjectName, items: [] };
                    this.projects.push(newProj);
                    this.switchProjectById(newId);
                    this.showCreateProjectModalFlag = false;
                },

                openEditProjectModal() {
                    this.editProjectNameText = this.currentProjectName;
                    this.showEditProjectModalFlag = true;
                },

                saveProjectName() {
                    if (!this.editProjectNameText.trim()) return;
                    let p = this.projects.find(x => x.id === this.selectedProjectId);
                    if (p) p.name = this.editProjectNameText;
                    this.currentProjectName = this.editProjectNameText;
                    this.showEditProjectModalFlag = false;
                },

                deleteProject(id) {
                    if (this.projects.length <= 1) { alert('系統中必須保留至少一個專案！'); return; }
                    if (confirm('確定要刪除此專案與內部所有資料嗎？')) {
                        this.projects = this.projects.filter(p => p.id !== id);
                        this.switchProjectById(this.projects[0].id);
                    }
                },

                saveOwnerPassword() {
                    if (this.tempOwnerPassword) {
                        this.ownerPassword = this.tempOwnerPassword;
                        alert('最高權限密碼更新完成！');
                    }
                },

                checkSettingsAccess() {
                    if (this.currentRole === 'Owner') {
                        this.activeTab = 'settings';
                    } else {
                        this.targetRoleToSwitch = 'Owner';
                        this.passwordPromptTitle = '進入系統設定需要【最高權限者 Owner】密碼';
                        this.enteredPassword = '';
                        this.showPasswordModalFlag = true;
                    }
                },

                addInspector() {
                    if (this.customInspectors.length >= 5) return;
                    let id = 'insp_' + Date.now();
                    this.customInspectors.push({ id: id, name: '新驗屋員', title: '檢驗員', password: '0000' });
                },
                removeInspector(id) { this.customInspectors = this.customInspectors.filter(i => i.id !== id); },

                addVendor() {
                    if (this.customVendors.length >= 5) return;
                    let id = 'ven_' + Date.now();
                    this.customVendors.push({ id: id, name: '新廠商', title: '工程廠商', password: '0000' });
                },
                removeVendor(id) { this.customVendors = this.customVendors.filter(v => v.id !== id); },

                addAdmin() {
                    if (this.customAdmins.length >= 5) return;
                    let id = 'adm_' + Date.now();
                    this.customAdmins.push({ id: id, name: '新管理員', title: '工程組長', password: '0000' });
                },
                removeAdmin(id) { this.customAdmins = this.customAdmins.filter(a => a.id !== id); },

                // 拖拽調整欄位
                handleHeaderDragStart(e, index) {
                    e.dataTransfer.setData('text/plain', index);
                },
                handleHeaderDrop(e, targetIndex) {
                    let sourceIndex = parseInt(e.dataTransfer.getData('text/plain'));
                    if (!isNaN(sourceIndex) && sourceIndex !== targetIndex) {
                        let movedCol = this.tableColumns.splice(sourceIndex, 1)[0];
                        this.tableColumns.splice(targetIndex, 0, movedCol);
                    }
                },

                // 多選與長按
                startRowPress(itemId) {
                    this.longPressTimer = setTimeout(() => {
                        this.batchMode = true;
                        if (!this.selectedItemIds.includes(itemId)) {
                            this.selectedItemIds.push(itemId);
                        }
                    }, 600);
                },
                cancelRowPress() { clearTimeout(this.longPressTimer); },

                toggleSelectAll() {
                    if (this.selectedItemIds.length === this.filteredItems.length) {
                        this.selectedItemIds = [];
                    } else {
                        this.selectedItemIds = this.filteredItems.map(i => i.id);
                    }
                },
                applyBatchSpace() {
                    if (!this.batchTargetSpace) return;
                    this.items.forEach(item => {
                        if (this.selectedItemIds.includes(item.id)) item.space = this.batchTargetSpace;
                    });
                    this.batchTargetSpace = '';
                },
                applyBatchStatus() {
                    if (!this.batchTargetStatus) return;
                    this.items.forEach(item => {
                        if (this.selectedItemIds.includes(item.id)) {
                            item.repairStatus = this.batchTargetStatus;
                            this.onStatusOrPhotoChange(item);
                        }
                    });
                    this.batchTargetStatus = '';
                },
                deleteBatchItems() {
                    if (confirm(`確定要刪除選取的 ${this.selectedItemIds.length} 個缺失項目嗎？`)) {
                        let p = this.projects.find(x => x.id === this.selectedProjectId);
                        if (p) p.items = p.items.filter(i => !this.selectedItemIds.includes(i.id));
                        this.selectedItemIds = [];
                        this.batchMode = false;
                    }
                },
                exitBatchMode() {
                    this.batchMode = false;
                    this.selectedItemIds = [];
                },

                onStatusOrPhotoChange(item) {
                    if (item.repairStatus === '已完成' && item.inspectionStatus === '合格') {
                        if (!item.completeDate) {
                            let d = new Date();
                            item.completeDate = d.toISOString().split('T')[0];
                        }
                    }
                },

                deleteItem(id) {
                    if (confirm('確定要刪除此缺失項目嗎？')) {
                        let p = this.projects.find(x => x.id === this.selectedProjectId);
                        if (p) p.items = p.items.filter(i => i.id !== id);
                    }
                },

                // 照片管理 Modal
                openPhotoModal(item, type) {
                    this.currentPhotoItem = item;
                    this.currentPhotoType = type;
                    this.activePhotoIndex = 0;
                    this.showPhotoModalFlag = true;
                },
                closePhotoModal() { this.showPhotoModalFlag = false; },

                currentPhotoList() {
                    if (!this.currentPhotoItem) return [];
                    if (this.currentPhotoType === 'defect') return this.currentPhotoItem.defectPhotos || [];
                    if (this.currentPhotoType === 'repair') return this.currentPhotoItem.repairPhotos || [];
                    if (this.currentPhotoType === 'inspection') return this.currentPhotoItem.inspectionPhotos || [];
                    return [];
                },

                getPhotosByType(item, type) {
                    if (type === 'defect') return item.defectPhotos || [];
                    if (type === 'repair') return item.repairPhotos || [];
                    if (type === 'inspection') return item.inspectionPhotos || [];
                    return [];
                },

                uploadPhotosFromInput(e) {
                    let files = e.target.files;
                    if (!files || files.length === 0) return;
                    for (let f of files) {
                        let reader = new FileReader();
                        reader.onload = (evt) => {
                            let list = this.currentPhotoList();
                            list.push(evt.target.result);
                            this.activePhotoIndex = list.length - 1;
                            this.onStatusOrPhotoChange(this.currentPhotoItem);
                        };
                        reader.readAsDataURL(f);
                    }
                },

                handleFileDrop(e) {
                    let files = e.dataTransfer.files;
                    if (!files || files.length === 0) return;
                    for (let f of files) {
                        let reader = new FileReader();
                        reader.onload = (evt) => {
                            let list = this.currentPhotoList();
                            list.push(evt.target.result);
                            this.activePhotoIndex = list.length - 1;
                            this.onStatusOrPhotoChange(this.currentPhotoItem);
                        };
                        reader.readAsDataURL(f);
                    }
                },

                deleteActivePhoto() {
                    let list = this.currentPhotoList();
                    if (list.length > 0) {
                        list.splice(this.activePhotoIndex, 1);
                        if (this.activePhotoIndex >= list.length) {
                            this.activePhotoIndex = Math.max(0, list.length - 1);
                        }
                    }
                },

                openOriginalImageView() {
                    let list = this.currentPhotoList();
                    if (list.length > 0 && list[this.activePhotoIndex]) {
                        window.open(list[this.activePhotoIndex], '_blank');
                    }
                },

                // 圖庫模式 Modal
                openGalleryModal() {
                    this.viewMode = 'gallery';
                    this.showGalleryModalFlag = true;
                },
                closeGalleryModal() { this.showGalleryModalFlag = false; },

                // 新增項目 Modal
                openNewItemModal() {
                    this.newItemForm = {
                        name: '',
                        space: this.spaceList[0] || '客廳',
                        category: this.categoryList[0] || '油漆工程',
                        method: this.methodList[0] || '目視與斜角手電筒照射檢查',
                        unit: this.unitList[0] || 'A1-01',
                        dueDate: '',
                        remark: '',
                        defectPhotos: []
                    };
                    this.showNewItemModalFlag = true;
                },

                uploadNewItemPhotos(e) {
                    let files = e.target.files;
                    if (!files) return;
                    for (let f of files) {
                        let reader = new FileReader();
                        reader.onload = (evt) => { this.newItemForm.defectPhotos.push(evt.target.result); };
                        reader.readAsDataURL(f);
                    }
                },

                handleNewItemDrop(e) {
                    let files = e.dataTransfer.files;
                    if (!files) return;
                    for (let f of files) {
                        let reader = new FileReader();
                        reader.onload = (evt) => { this.newItemForm.defectPhotos.push(evt.target.result); };
                        reader.readAsDataURL(f);
                    }
                },

                removeNewItemPhoto(idx) { this.newItemForm.defectPhotos.splice(idx, 1); },

                saveNewItem() {
                    if (!this.newItemForm.name.trim()) { alert('請填寫項目名稱'); return; }
                    let newCode = 'DEF-' + String(this.items.length + 1).padStart(3, '0');
                    let newItem = {
                        id: 'item_' + Date.now(),
                        code: newCode,
                        name: this.newItemForm.name,
                        method: this.newItemForm.method,
                        space: this.newItemForm.space,
                        category: this.newItemForm.category,
                        unit: this.newItemForm.unit,
                        repairStatus: '待修繕',
                        inspectionStatus: '待複查',
                        dueDate: this.newItemForm.dueDate,
                        completeDate: '',
                        inspector: this.currentRoleName(),
                        remark: this.newItemForm.remark,
                        defectPhotos: [...this.newItemForm.defectPhotos],
                        repairPhotos: [],
                        inspectionPhotos: []
                    };

                    let p = this.projects.find(x => x.id === this.selectedProjectId);
                    if (p) p.items.unshift(newItem);
                    this.showNewItemModalFlag = false;
                },

                // 編輯內容 Modal
                openEditModal(item) {
                    this.editItemForm = JSON.parse(JSON.stringify(item));
                    this.showEditItemModalFlag = true;
                },

                saveEditedItem() {
                    if (!this.editItemForm.name.trim()) { alert('請填寫項目名稱'); return; }
                    let target = this.items.find(i => i.id === this.editItemForm.id);
                    if (target) {
                        Object.assign(target, this.editItemForm);
                        this.onStatusOrPhotoChange(target);
                    }
                    this.showEditItemModalFlag = false;
                },

                // 選項小視窗
                openOptionEdit(type) {
                    this.editingOptionType = type;
                    if (type === 'space') this.optionCategoryTitle = '空間位置';
                    if (type === 'category') this.optionCategoryTitle = '工種/類別';
                    if (type === 'method') this.optionCategoryTitle = '驗收方法';
                    if (type === 'unit') this.optionCategoryTitle = '戶別';
                    this.newOptionText = '';
                    this.showOptionEditModalFlag = true;
                },

                currentEditingOptionList() {
                    if (this.editingOptionType === 'space') return this.spaceList;
                    if (this.editingOptionType === 'category') return this.categoryList;
                    if (this.editingOptionType === 'method') return this.methodList;
                    if (this.editingOptionType === 'unit') return this.unitList;
                    return [];
                },

                addNewOption() {
                    if (!this.newOptionText.trim()) return;
                    let list = this.currentEditingOptionList();
                    if (!list.includes(this.newOptionText.trim())) {
                        list.push(this.newOptionText.trim());
                    }
                    this.newOptionText = '';
                },

                removeOption(index) {
                    let list = this.currentEditingOptionList();
                    list.splice(index, 1);
                }
            }));
        });
    </script>
</body>
</html>
