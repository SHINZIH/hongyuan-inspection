<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行動化驗屋與修繕追蹤系統</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f8fafc;
      font-family: "Noto Sans TC", "Segoe UI", sans-serif;
    }
    #loader {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #0f172a;
      background: linear-gradient(135deg, #eff6ff, #f8fafc);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div id="loader">載入系統中，請稍候...</div>

  <script>
    (async function () {
      const sourceUrl = 'https://raw.githubusercontent.com/SHINZIH/hongyuan-inspection/main/hongyuan-inspection.index.html';

      try {
        const response = await fetch(sourceUrl, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('Load failed: ' + response.status);
        }
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const loader = document.getElementById('loader');
        if (loader) {
          loader.textContent = '系統載入失敗，請確認檔案已上傳並重新整理。';
        }
        console.error(error);
      }
    })();
  </script>
</body>
</html>
