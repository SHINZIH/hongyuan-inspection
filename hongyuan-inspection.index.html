<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行動化驗屋與修繕追蹤系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF 匯出核心套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Supabase JS SDK 對接雲端儲存 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .draggable-col {
            cursor: grab;
        }
        .draggable-col:active {
            cursor: grabbing;
        }
        .pdf-preview-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .pdf-preview-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased" x-data="inspectionApp()">

    <!-- 🔒 全頁身分核實封鎖畫面 -->
    <div x-show="!isSiteAuthenticated" class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900 text-slate-100 p-4" style="display: none;">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-md p-6 sm:p-8 space-y-6 text-center">
            <div class="w-16 h-16 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-2xl flex items-center justify-center mx-auto text-3xl shadow-lg">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-white tracking-wide">系統身分安全核實</h2>
                <p class="text-xs text-slate-400 mt-1.5">進入行動化驗屋系統前，請先輸入授權帳戶與密碼</p>
            </div>

            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">登入帳號</label>
                    <input type="text" x-model="siteLoginAccount" :disabled="lockoutRemainingSeconds > 0" placeholder="請輸入帳號..." class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm disabled:opacity-50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">登入密碼</label>
                    <input type="password" x-model="siteLoginPassword" :disabled="lockoutRemainingSeconds > 0" @keyup.enter="handleSiteLogin()" placeholder="請輸入密碼..." class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm disabled:opacity-50">
                </div>
            </div>

            <template x-if="lockoutRemainingSeconds > 0">
                <div class="bg-red-500/10 border border-red-500/30 text-red-400 p-3.5 rounded-xl text-xs flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-triangle-exclamation text-base shrink-0"></i>
                    <span>連續輸入錯誤 5 次！已限制登入，請等待 <strong class="font-mono text-sm text-red-300" x-text="formatLockoutTime(lockoutRemainingSeconds)"></strong> 後再試</span>
                </div>
            </template>

            <template x-if="loginErrorMsg && lockoutRemainingSeconds <= 0">
                <div class="bg-amber-500/10 border border-amber-500/30 text-amber-400 p-3 rounded-xl text-xs font-medium" x-text="loginErrorMsg"></div>
            </template>

            <button @click="handleSiteLogin()" :disabled="lockoutRemainingSeconds > 0" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm transition shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
                <span x-text="lockoutRemainingSeconds > 0 ? '系統鎖定中...' : '核實身分並進入網站'"></span>
            </button>

            <div class="text-[11px] text-slate-500 pt-2 border-t border-slate-700/50">
                預設最高權限帳號：<span class="font-mono text-slate-300">Admin8866</span>
            </div>
        </div>
    </div>

    <div class="flex h-screen overflow-hidden">
        
        <!-- Mobile Sidebar Toggle Button -->
        <button @click="mobileSidebarOpen = !mobileSidebarOpen" class="md:hidden fixed bottom-6 right-6 z-50 w-14 h-14 bg-blue-600 text-white rounded-full shadow-2xl flex items-center justify-center text-xl transition hover:bg-blue-700">
            <i class="fa-solid" :class="mobileSidebarOpen ? 'fa-xmark' : 'fa-bars'"></i>
        </button>

        <!-- Left Sidebar -->
        <aside :class="mobileSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'" class="fixed md:static inset-y-0 left-0 w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shadow-xl z-40 transition-transform duration-300 ease-in-out">
            <div>
                <!-- Brand / Logo -->
                <div class="px-6 py-5 border-b border-slate-800 flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-lg shadow-md">
                        <i class="fa-solid fa-house-chimney-user"></i>
                    </div>
                    <div>
                        <h2 class="text-white font-bold text-sm tracking-wide truncate max-w-[130px]" x-text="currentProjectName"></h2>
                        <span class="text-[11px] text-blue-400 font-medium">智慧化驗屋系統 v3.2</span>
                    </div>
                </div>

                <!-- Navigation Links -->
                <nav class="p-4 space-y-1.5 text-sm">
                    <a href="#" @click.prevent="activeTab = 'inspection'; mobileSidebarOpen = false" class="flex items-center justify-between px-3.5 py-2.5 rounded-lg transition" :class="activeTab === 'inspection' ? 'bg-blue-600 text-white font-medium shadow-sm' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-clipboard-list w-5 text-center"></i>
                            <span>自主驗屋初驗清單</span>
                        </div>
                        <span class="text-xs px-2 py-0.5 rounded-full font-bold" :class="activeTab === 'inspection' ? 'bg-blue-700 text-white' : 'bg-slate-800 text-slate-300'" x-text="items.length"></span>
                    </a>
                    
                    <a href="#" @click.prevent="activeTab = 'projects'; mobileSidebarOpen = false" class="flex items-center justify-between px-3.5 py-2.5 rounded-lg transition" :class="activeTab === 'projects' ? 'bg-blue-600 text-white font-medium shadow-sm' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-folder-open w-5 text-center"></i>
                            <span>專案清單管理</span>
                        </div>
                        <span class="text-xs px-2 py-0.5 rounded-full font-bold" :class="activeTab === 'projects' ? 'bg-blue-700 text-white' : 'bg-slate-800 text-slate-300'" x-text="projects.length"></span>
                    </a>

                    <a href="#" @click.prevent="activeTab = 'analytics'; mobileSidebarOpen = false" class="flex items-center justify-between px-3.5 py-2.5 rounded-lg transition" :class="activeTab === 'analytics' ? 'bg-blue-600 text-white font-medium shadow-sm' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-chart-pie w-5 text-center"></i>
                            <span>修繕數據統計</span>
                        </div>
                    </a>
                    <a href="#" @click.prevent="checkSettingsAccess(); mobileSidebarOpen = false" class="flex items-center justify-between px-3.5 py-2.5 rounded-lg transition" :class="activeTab === 'settings' ? 'bg-blue-600 text-white font-medium shadow-sm' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-gear w-5 text-center"></i>
                            <span>系統參數設定</span>
                        </div>
                    </a>
                </nav>
            </div>

            <div class="p-4 border-t border-slate-800 bg-slate-950/40 text-xs space-y-2">
                <div class="flex items-center justify-between text-slate-400">
                    <span>當前模擬身份</span>
                    <span class="text-emerald-400 font-semibold" x-text="currentRoleName()"></span>
                </div>
                <p class="text-[11px] text-slate-500">提示：未正確輸入密碼將自動切換為純觀看者模式。</p>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-3">
                    
                    <div class="flex items-center space-x-3">
                        <div class="md:hidden w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">
                            <i class="fa-solid fa-house-chimney-user"></i>
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h1 class="text-lg font-bold text-slate-800 tracking-tight" x-text="currentProjectName"></h1>
                                <template x-if="hasPermission('edit')">
                                    <button @click="openEditProjectModal()" class="text-xs text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-2 py-0.5 rounded transition font-medium">
                                        <i class="fa-solid fa-pen-to-square mr-1"></i>變更名稱
                                    </button>
                                </template>
                            </div>
                            <p class="text-xs text-slate-500">當前檢驗戶別：<span class="font-semibold text-blue-600" x-text="selectedUnitFilter || '全部戶別'"></span></p>
                        </div>
                    </div>

                    <div class="flex items-center space-x-3">
                        <div class="flex items-center space-x-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg text-xs">
                            <span class="text-slate-500 font-medium"><i class="fa-solid fa-user-shield mr-1"></i>權限角色：</span>
                            <select :value="currentRole" @change="onRoleSelectChange($event)" class="bg-transparent font-bold text-blue-600 focus:outline-none cursor-pointer">
                                <option value="Owner">最高權限 (Owner)</option>
                                <option value="Inspector" x-text="customInspectors[0] ? (customInspectors[0].name + ' (' + customInspectors[0].title + ')') : '驗屋人員'"></option>
                                <template x-for="insp in customInspectors.slice(1)" :key="insp.id">
                                    <option :value="'CustomInspector_' + insp.id" x-text="insp.name + ' (' + insp.title + ')'"></option>
                                </template>
                                <option value="Vendor" x-text="customVendors[0] ? (customVendors[0].name + ' (' + customVendors[0].title + ')') : '廠商'"></option>
                                <template x-for="ven in customVendors.slice(1)" :key="ven.id">
                                    <option :value="'CustomVendor_' + ven.id" x-text="ven.name + ' (' + ven.title + ')'"></option>
                                </template>
                                <option value="Admin" x-text="customAdmins[0] ? (customAdmins[0].name + ' (' + customAdmins[0].title + ')') : '工務/管理員'"></option>
                                <template x-for="adm in customAdmins.slice(1)" :key="adm.id">
                                    <option :value="'CustomAdmin_' + adm.id" x-text="adm.name + ' (' + adm.title + ')'"></option>
                                </template>
                                <option value="Viewer">純觀看者 (Viewer)</option>
                            </select>
                        </div>

                        <!-- 📄 匯出 PDF 按鈕 -->
                        <button @click="openPdfExportModal()" class="bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center space-x-1.5 shadow-sm">
                            <i class="fa-solid fa-file-pdf"></i>
                            <span>匯出 PDF 報告</span>
                        </button>

                        <template x-if="hasPermission('create')">
                            <button @click="openNewItemModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center space-x-2 shadow-sm">
                                <i class="fa-solid fa-plus"></i>
                                <span>新增驗屋缺失項目</span>
                            </button>
                        </template>

                        <!-- 🔒 建立新專案按鈕（僅限 Owner 最高權限） -->
                        <template x-if="hasPermission('createProject')">
                            <button @click="openCreateProjectModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center space-x-1.5 shadow-sm" title="建立全新專案">
                                <i class="fa-solid fa-folder-plus"></i>
                                <span class="hidden sm:inline">新專案</span>
                            </button>
                        </template>
                    </div>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">

                <!-- 專案清單管理 Tab 畫面 -->
                <template x-if="activeTab === 'projects'">
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-100">
                                <div>
                                    <h2 class="text-lg font-bold text-slate-800 flex items-center space-x-2">
                                        <i class="fa-solid fa-folder-open text-blue-600"></i>
                                        <span>專案清單與切換管理</span>
                                    </h2>
                                    <p class="text-xs text-slate-500 mt-1">您可在此透過下拉選單或專案列表，快速切換與管理所有已新增的新專案項目內容。</p>
                                </div>
                                <template x-if="hasPermission('createProject')">
                                    <button @click="openCreateProjectModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2 shadow-sm">
                                        <i class="fa-solid fa-folder-plus"></i>
                                        <span>建立全新專案</span>
                                    </button>
                                </template>
                            </div>

                            <div class="py-6 grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                                <div class="space-y-2">
                                    <label class="block text-sm font-semibold text-slate-700">選擇要切換或管理的專案項目：</label>
                                    <div class="flex items-center space-x-3">
                                        <div class="relative flex-1">
                                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                                <i class="fa-solid fa-bars-progress"></i>
                                            </span>
                                            <select :value="selectedProjectId" @change="switchProjectById($event.target.value)" class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl bg-slate-50 text-slate-800 font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-xs">
                                                <template x-for="p in projects" :key="p.id">
                                                    <option :value="p.id" x-text="p.name + ' (' + (p.items ? p.items.length : 0) + ' 筆缺失)'"></option>
                                                </template>
                                            </select>
                                        </div>
                                        <button @click="activeTab = 'inspection'" class="px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold transition shadow-sm flex items-center space-x-2">
                                            <i class="fa-solid fa-arrow-right-to-bracket"></i>
                                            <span>進入檢視清單</span>
                                        </button>
                                    </div>
                                </div>

                                <div class="bg-blue-50/60 border border-blue-100 rounded-2xl p-4 flex items-center space-x-4">
                                    <div class="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center text-2xl shadow-md shrink-0">
                                        <i class="fa-solid fa-building-shield"></i>
                                    </div>
                                    <div>
                                        <span class="text-xs text-blue-600 font-bold">目前作用中專案</span>
                                        <h4 class="text-base font-bold text-slate-800" x-text="currentProjectName"></h4>
                                        <p class="text-xs text-slate-500 mt-0.5">包含項目總數：<span class="font-semibold text-slate-700" x-text="items.length"></span> 筆</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                                <h3 class="font-bold text-slate-800 text-sm">所有已新增專案總覽</h3>
                                <span class="text-xs text-slate-500">共計 <span class="font-bold text-slate-700" x-text="projects.length"></span> 個專案</span>
                            </div>
                            <div class="divide-y divide-slate-100">
                                <template x-for="proj in projects" :key="proj.id">
                                    <div class="p-4 sm:p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:bg-slate-50/70 transition">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center font-bold">
                                                <i class="fa-solid fa-folder"></i>
                                            </div>
                                            <div>
                                                <div class="flex items-center space-x-2">
                                                    <h4 class="font-bold text-slate-800 text-base" x-text="proj.name"></h4>
                                                    <template x-if="proj.name === currentProjectName">
                                                        <span class="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-0.5 rounded-full font-bold">當前使用中</span>
                                                    </template>
                                                </div>
                                                <p class="text-xs text-slate-500 mt-0.5">專案編號 ID: <span class="font-mono" x-text="proj.id"></span> ｜ 檢驗缺失項目數：<span class="font-semibold text-slate-700" x-text="proj.items ? proj.items.length : 0"></span> 筆</p>
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                                            <button @click="switchProjectById(proj.id); activeTab = 'inspection'" class="px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-xs font-semibold transition">
                                                <i class="fa-solid fa-eye mr-1"></i>切換檢視
                                            </button>
                                            <template x-if="hasPermission('createProject')">
                                                <button @click="deleteProject(proj.id)" class="px-3 py-1.5 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg text-xs font-semibold transition" :disabled="projects.length <= 1">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- 自主驗屋初驗清單 Tab 畫面 -->
                <template x-if="activeTab === 'inspection'">
                    <div class="space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                                <div>
                                    <p class="text-xs text-slate-500 font-medium">總檢驗項目</p>
                                    <h3 class="text-2xl font-bold text-slate-800 mt-1" x-text="filteredItems.length"></h3>
                                </div>
                                <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
                                    <i class="fa-solid fa-clipboard-list"></i>
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                                <div>
                                    <p class="text-xs text-slate-500 font-medium">待修繕缺失</p>
                                    <h3 class="text-2xl font-bold text-amber-600 mt-1" x-text="filteredItems.filter(i => i.repairStatus === '待修繕').length"></h3>
                                </div>
                                <div class="w-10 h-10 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center text-lg">
                                    <i class="fa-solid fa-clock-rotate-left"></i>
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                                <div>
                                    <p class="text-xs text-slate-500 font-medium">修繕中</p>
                                    <h3 class="text-2xl font-bold text-blue-600 mt-1" x-text="filteredItems.filter(i => i.repairStatus === '修繕中').length"></h3>
                                </div>
                                <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
                                    <i class="fa-solid fa-screwdriver-wrench"></i>
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                                <div>
                                    <p class="text-xs text-slate-500 font-medium">已完成驗收</p>
                                    <h3 class="text-2xl font-bold text-emerald-600 mt-1" x-text="filteredItems.filter(i => i.repairStatus === '已完成').length"></h3>
                                </div>
                                <div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg">
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                            </div>
                        </div>

                        <!-- 批量操作面板 -->
                        <template x-if="batchMode">
                            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex flex-wrap justify-between items-center gap-4 transition shadow-sm">
                                <div class="flex items-center space-x-3">
                                    <span class="bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded-md" x-text="'已選取 ' + selectedItemIds.length + ' 項'"></span>
                                    <button @click="toggleSelectAll()" class="text-xs text-blue-700 hover:underline font-semibold" x-text="selectedItemIds.length === filteredItems.length ? '取消全選' : '全選所有項目'"></button>
                                </div>
                                <div class="flex flex-wrap items-center gap-2">
                                    <select x-model="batchTargetSpace" class="text-xs border rounded-lg px-2.5 py-1.5 bg-white">
                                        <option value="">批次修改空間...</option>
                                        <template x-for="s in spaceOptions" :key="s"><option :value="s" x-text="s"></option></template>
                                    </select>

                searchQuery: '',

                filterStatus: '',

                currentPage: 1,
                pageSize: 10,

                // --- 5. 表格欄位拖曳 ---
                tableColumns: [
                    { key: 'code', label: '編號', width: '70px', align: 'center' },
                    { key: 'unit', label: '戶別', width: '80px', align: 'center' },

                    { key: 'repairStatus', label: '修繕狀態', width: '110px', align: 'center' },
                    { key: 'inspectionStatus', label: '工檢狀態', width: '110px', align: 'center' },
                    { key: 'dueDate', label: '預計完成', width: '100px', align: 'center' },
                    { key: 'completeDate', label: '實際完成', width: '100px', align: 'center' },
                    { key: 'inspector', label: '檢驗員', width: '90px' },
                    { key: 'remark', label: '備註', width: '150px' },
                    { key: 'action', label: '操作', width: '90px', align: 'center' }
                ],
                draggedColIndex: null,

                // --- 6. 批量操作 ---
                batchMode: false,
                selectedItemIds: [],
                batchTargetSpace: '',
                batchTargetStatus: '',
                rowPressTimer: null,

                // --- 7. 圖庫與相片 Modal ---
                showGalleryModalFlag: false,
                galleryPhotoType: 'defect',
                galleryColumnsVisible: {
                    nameMethod: true,
                    space: true,
                    unit: true,
                    repairStatus: true,
                    inspectionStatus: true
                },
                showPhotoModalFlag: false,
                activePhotoItem: null,
                activePhotoType: 'defect',

                // --- 8. 項目與專案彈窗 Modal ---
                showItemModalFlag: false,
                isEditingItem: false,
                itemForm: { id: '', code: '', name: '', space: '', category: '', unit: '', method: '', repairStatus: '待修繕', inspectionStatus: '待複查', dueDate: '', completeDate: '', inspector: '', remark: '', defectPhotos: [], repairPhotos: [], inspectionPhotos: [] },

                showProjectModalFlag: false,
                isEditingProject: false,
                projectForm: { id: '', name: '' },

                // --- 9. PDF 匯出模組 ---
                showPdfExportModalFlag: false,
                pdfForm: {
                    title: '',
                    client: '',
                    projectName: '',
                    address: '',
                    remark: '',
                    photoTypes: ['defect', 'repair'],
                    scale: 100
                },

                // --- 10. 數據分析統計 Modal ---
                analyticsChartType: 'pie',
                analyticsProjectId: 'proj-1',
                analyticsSpace: '',
                analyticsUnit: '',
                analyticsCategory: '',

                // --- 計算屬性 (Getters) ---
                get currentProject() {
                    return this.projects.find(p => p.id === this.selectedProjectId) || this.projects[0] || { id: '', name: '未命名專案', items: [] };
                },
                get currentProjectName() {
                    return this.currentProject.name;
                },
                get items() {
                    return this.currentProject.items || [];
                },
                get spaceOptions() {
                    return Array.from(new Set(this.items.map(i => i.space).filter(Boolean)));
                },
                get categoryOptions() {
                    return Array.from(new Set(this.items.map(i => i.category).filter(Boolean)));
                },
                get unitOptions() {
                    return Array.from(new Set(this.items.map(i => i.unit).filter(Boolean)));
                },
                get filteredItems() {
                    return this.items.filter(item => {
                        const matchSpace = !this.selectedSpaceFilter || item.space === this.selectedSpaceFilter;
                        const matchCategory = !this.selectedCategoryFilter || item.category === this.selectedCategoryFilter;
                        const matchUnit = !this.selectedUnitFilter || item.unit === this.selectedUnitFilter;
                        const matchStatus = !this.filterStatus || item.repairStatus === this.filterStatus;
                        const matchInspStatus = !this.filterInspectionStatus || item.inspectionStatus === this.filterInspectionStatus;
                        const query = this.searchQuery.trim().toLowerCase();
                        const matchQuery = !query || (item.name && item.name.toLowerCase().includes(query)) || (item.remark && item.remark.toLowerCase().includes(query)) || (item.code && item.code.toLowerCase().includes(query));
                        return matchSpace && matchCategory && matchUnit && matchStatus && matchInspStatus && matchQuery;
                    });
                },
                get totalPages() {
                    return Math.ceil(this.filteredItems.length / this.pageSize) || 1;
                },
                get paginatedItems() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    return this.filteredItems.slice(start, start + this.pageSize);
                },

                // Analytics 計算屬性
                get analyticsTargetProject() {
                    return this.projects.find(p => p.id === this.analyticsProjectId) || this.currentProject;
                },
                get analyticsSpaceList() {
                    return Array.from(new Set((this.analyticsTargetProject.items || []).map(i => i.space).filter(Boolean)));
                },
                get analyticsUnitList() {
                    return Array.from(new Set((this.analyticsTargetProject.items || []).map(i => i.unit).filter(Boolean)));
                },
                get analyticsCategoryList() {
                    return Array.from(new Set((this.analyticsTargetProject.items || []).map(i => i.category).filter(Boolean)));
                },
                get analyticsFilteredItems() {
                    const items = this.analyticsTargetProject.items || [];
                    return items.filter(i => {
                        const matchSpace = !this.analyticsSpace || i.space === this.analyticsSpace;
                        const matchUnit = !this.analyticsUnit || i.unit === this.analyticsUnit;
                        const matchCat = !this.analyticsCategory || i.category === this.analyticsCategory;
                        return matchSpace && matchUnit && matchCat;
                    });
                },
                get analyticsCompletedCount() {
                    return this.analyticsFilteredItems.filter(i => i.repairStatus === '已完成').length;
                },
                get analyticsCompletionRate() {
                    if (this.analyticsFilteredItems.length === 0) return 0;
                    return Math.round((this.analyticsCompletedCount / this.analyticsFilteredItems.length) * 100);
                },

                // --- 初始化與持久化儲存 ---
                init() {
                    this.loadLocalStorage();
                    this.checkLockoutStatus();
                    this.analyticsProjectId = this.selectedProjectId;
                    this.pdfForm.title = this.currentProjectName;
                    this.pdfForm.projectName = this.currentProjectName;
                },

                loadLocalStorage() {
                    try {
                        const savedAuth = localStorage.getItem('hy_auth_status');
                        if (savedAuth === 'true') this.isSiteAuthenticated = true;

                        const savedAdminCreds = localStorage.getItem('hy_admin_credentials');
                        if (savedAdminCreds) {
                            const parsed = JSON.parse(savedAdminCreds);
                            this.adminAccount = parsed.account || this.adminAccount;
                            this.adminPassword = parsed.password || this.adminPassword;
                        }
                        this.tempAdminAccount = this.adminAccount;
                        this.tempAdminPassword = this.adminPassword;

                        const savedOwnerPwd = localStorage.getItem('hy_owner_password');
                        if (savedOwnerPwd) this.ownerPassword = savedOwnerPwd;

                        const savedProjects = localStorage.getItem('hy_projects');
                        if (savedProjects) {
                            this.projects = JSON.parse(savedProjects);
                        }
                        const savedProjId = localStorage.getItem('hy_selected_project_id');
                        if (savedProjId && this.projects.some(p => p.id === savedProjId)) {
                            this.selectedProjectId = savedProjId;
                        }

                        const savedSupa = localStorage.getItem('hy_supabase_config');
                        if (savedSupa) {
                            const parsed = JSON.parse(savedSupa);
                            this.supabaseUrl = parsed.url || '';
                            this.supabaseKey = parsed.key || '';
                            this.initSupabase();
                        }

                        const savedUsers = localStorage.getItem('hy_system_users');
                        if (savedUsers) this.systemUsers = JSON.parse(savedUsers);

                        const savedInsp = localStorage.getItem('hy_custom_inspectors');
                        if (savedInsp) this.customInspectors = JSON.parse(savedInsp);

                        const savedVen = localStorage.getItem('hy_custom_vendors');
                        if (savedVen) this.customVendors = JSON.parse(savedVen);

                        const savedAdm = localStorage.getItem('hy_custom_admins');
                        if (savedAdm) this.customAdmins = JSON.parse(savedAdm);
                    } catch (e) {
                        console.error("載入本地儲存出錯", e);
                    }
                },

                saveProjectsToStorage() {
                    try {
                        localStorage.setItem('hy_projects', JSON.stringify(this.projects));
                        localStorage.setItem('hy_selected_project_id', this.selectedProjectId);
                    } catch (e) {
                        console.error("儲存專案出錯", e);
                    }
                },

                // --- Supabase 雲端設定 ---
                initSupabase() {
                    if (this.supabaseUrl && this.supabaseKey && window.supabase) {
                        try {
                            this.supabaseClient = window.supabase.createClient(this.supabaseUrl, this.supabaseKey);
                        } catch (e) {
                            console.error("Supabase 初始化失敗:", e);
                        }
                    }
                },
                saveSupabaseConfig() {
                    localStorage.setItem('hy_supabase_config', JSON.stringify({ url: this.supabaseUrl, key: this.supabaseKey }));
                    this.initSupabase();
                    alert("Supabase 雲端金鑰已成功儲存！");
                },

                // --- 登入與防爆破鎖定機制 ---
                handleSiteLogin() {
                    if (this.lockoutRemainingSeconds > 0) return;

                    if (this.siteLoginAccount === this.adminAccount && this.siteLoginPassword === this.adminPassword) {
                        this.isSiteAuthenticated = true;
                        this.loginErrorMsg = '';
                        this.failedAttempts = 0;
                        localStorage.setItem('hy_auth_status', 'true');
                        return;
                    }

                    const matchedUser = this.systemUsers.find(u => u.username === this.siteLoginAccount && u.password === this.siteLoginPassword);
                    if (matchedUser) {
                        this.isSiteAuthenticated = true;
                        this.currentRole = matchedUser.role;
                        this.loginErrorMsg = '';
                        this.failedAttempts = 0;
                        localStorage.setItem('hy_auth_status', 'true');
                        return;
                    }

                    this.failedAttempts++;
                    if (this.failedAttempts >= 5) {
                        const lockoutUntil = Date.now() + 300 * 1000;
                        localStorage.setItem('hy_lockout_until', lockoutUntil.toString());
                        this.startLockoutTimer(300);
                        this.loginErrorMsg = '連續失敗5次，系統已限制登入！';
                    } else {
                        this.loginErrorMsg = `帳號或密碼錯誤！（剩餘嘗試次數：${5 - this.failedAttempts} 次）`;
                    }
                },

                checkLockoutStatus() {
                    const lockoutUntil = localStorage.getItem('hy_lockout_until');
                    if (lockoutUntil) {
                        const remaining = Math.ceil((parseInt(lockoutUntil) - Date.now()) / 1000);
                        if (remaining > 0) {
                            this.startLockoutTimer(remaining);
                        } else {
                            localStorage.removeItem('hy_lockout_until');
                        }
                    }
                },

                startLockoutTimer(seconds) {
                    this.lockoutRemainingSeconds = seconds;
                    if (this.lockoutTimer) clearInterval(this.lockoutTimer);
                    this.lockoutTimer = setInterval(() => {
                        this.lockoutRemainingSeconds--;
                        if (this.lockoutRemainingSeconds <= 0) {
                            clearInterval(this.lockoutTimer);
                            this.failedAttempts = 0;
                            localStorage.removeItem('hy_lockout_until');
                        }
                    }, 1000);
                },

                formatLockoutTime(seconds) {
                    const m = Math.floor(seconds / 60);
                    const s = seconds % 60;
                    return `${m}分${s < 10 ? '0' : ''}${s}秒`;
                },

                // --- 角色與權限判斷 ---
                currentRoleName() {
                    if (this.currentRole === 'Owner') return '最高權限 (Owner)';
                    if (this.currentRole === 'Inspector') return '主驗屋師';
                    if (this.currentRole === 'Vendor') return '主要廠商';
                    if (this.currentRole === 'Admin') return '工務/管理員';
                    if (this.currentRole === 'Viewer') return '純觀看者 (Viewer)';
                    if (this.currentRole.startsWith('CustomInspector_')) {
                        const id = parseInt(this.currentRole.replace('CustomInspector_', ''));
                        const ins = this.customInspectors.find(i => i.id === id);
                        return ins ? ins.name : '驗屋師';
                    }
                    if (this.currentRole.startsWith('CustomVendor_')) {
                        const id = parseInt(this.currentRole.replace('CustomVendor_', ''));
                        const ven = this.customVendors.find(v => v.id === id);
                        return ven ? ven.name : '廠商';
                    }
                    if (this.currentRole.startsWith('CustomAdmin_')) {
                        const id = parseInt(this.currentRole.replace('CustomAdmin_', ''));
                        const adm = this.customAdmins.find(a => a.id === id);
                        return adm ? adm.name : '管理員';
                    }
                    return '使用者';
                },

                hasPermission(action) {
                    if (this.currentRole === 'Owner') return true;
                    if (action === 'createProject') return this.currentRole === 'Owner';
                    if (action === 'settings') return this.currentRole === 'Owner';
                    if (action === 'delete') return ['Owner', 'Admin'].includes(this.currentRole) || this.currentRole.startsWith('CustomAdmin_');
                    if (action === 'create') return ['Owner', 'Inspector', 'Admin'].includes(this.currentRole) || this.currentRole.startsWith('CustomInspector_') || this.currentRole.startsWith('CustomAdmin_');
                    if (action === 'edit') return this.currentRole !== 'Viewer';
                    return false;
                },

                onRoleSelectChange(event) {
                    const newRole = event.target.value;
                    if (newRole === 'Owner') {
                        this.promptPassword('請輸入最高權限密碼以切換角色：', (pwd) => {
                            if (pwd === this.ownerPassword || pwd === this.adminPassword) {
                                this.currentRole = newRole;
                            } else {
                                alert('密碼驗證錯誤！');
                                event.target.value = this.currentRole;
                            }
                        });
                    } else {
                        this.currentRole = newRole;
                    }
                },

                checkSettingsAccess() {
                    if (this.hasPermission('settings')) {
                        this.activeTab = 'settings';
                    } else {
                        this.promptPassword('此區塊受保護，請輸入最高權限密碼：', (pwd) => {
                            if (pwd === this.ownerPassword || pwd === this.adminPassword) {
                                this.activeTab = 'settings';
                            } else {
                                alert('密碼驗證錯誤，無法存取系統設定！');
                            }
                        });
                    }
                },

                promptPassword(title, callback) {
                    this.passwordPromptTitle = title;
                    this.enteredPassword = '';
                    this.passwordVerifyCallback = callback;
                    this.showPasswordModalFlag = true;
                    this.$nextTick(() => {
                        if (this.$refs.pwdInput) this.$refs.pwdInput.focus();
                    });
                },

                verifyPassword() {
                    const pwd = this.enteredPassword;
                    this.showPasswordModalFlag = false;
                    if (this.passwordVerifyCallback) {
                        this.passwordVerifyCallback(pwd);
                    }
                },

                cancelPasswordModal() {
                    this.showPasswordModalFlag = false;
                    this.passwordVerifyCallback = null;
                },

                // --- 系統設定操作 ---
                saveAdminCredentials() {
                    this.adminAccount = this.tempAdminAccount;
                    this.adminPassword = this.tempAdminPassword;
                    localStorage.setItem('hy_admin_credentials', JSON.stringify({ account: this.adminAccount, password: this.adminPassword }));
                    alert('最高權限帳戶密碼已成功更新！');
                },

                saveOwnerPassword() {
                    this.ownerPassword = this.tempOwnerPassword;
                    localStorage.setItem('hy_owner_password', this.ownerPassword);
                    alert('最高權限快速切換密碼已更新！');
                },

                addSystemUser() {
                    if (!this.newSystemUser.username || !this.newSystemUser.password) {
                        alert('請輸入完整的登入帳號與密碼！');
                        return;
                    }
                    this.systemUsers.push({
                        id: Date.now(),
                        ...this.newSystemUser
                    });
                    this.newSystemUser = { username: '', password: '', name: '', role: 'Inspector' };
                    localStorage.setItem('hy_system_users', JSON.stringify(this.systemUsers));
                },

                removeSystemUser(id) {
                    this.systemUsers = this.systemUsers.filter(u => u.id !== id);
                    localStorage.setItem('hy_system_users', JSON.stringify(this.systemUsers));
                },

                getRoleLabel(role) {
                    const map = { Owner: '最高權限', Inspector: '驗屋人員', Vendor: '廠商', Admin: '工務/管理員', Viewer: '純觀看者' };
                    return map[role] || role;
                },

                addInspector() {
                    this.customInspectors.push({ id: Date.now(), name: '新驗屋師', title: '驗屋人員', password: '123' });
                    localStorage.setItem('hy_custom_inspectors', JSON.stringify(this.customInspectors));
                },
                removeInspector(id) {
                    this.customInspectors = this.customInspectors.filter(i => i.id !== id);
                    localStorage.setItem('hy_custom_inspectors', JSON.stringify(this.customInspectors));
                },

                addVendor() {
                    this.customVendors.push({ id: Date.now(), name: '新廠商', title: '工班廠商', password: '123' });
                    localStorage.setItem('hy_custom_vendors', JSON.stringify(this.customVendors));
                },
                removeVendor(id) {
                    this.customVendors = this.customVendors.filter(v => v.id !== id);
                    localStorage.setItem('hy_custom_vendors', JSON.stringify(this.customVendors));
                },

                addAdmin() {
                    this.customAdmins.push({ id: Date.now(), name: '新管理員', title: '工務組長', password: '123' });
                    localStorage.setItem('hy_custom_admins', JSON.stringify(this.customAdmins));
                },
                removeAdmin(id) {
                    this.customAdmins = this.customAdmins.filter(a => a.id !== id);
                    localStorage.setItem('hy_custom_admins', JSON.stringify(this.customAdmins));
                },

                // --- 專案管理操作 ---
                switchProjectById(id) {
                    if (this.projects.some(p => p.id === id)) {
                        this.selectedProjectId = id;
                        this.analyticsProjectId = id;
                        this.pdfForm.title = this.currentProjectName;
                        this.pdfForm.projectName = this.currentProjectName;
                        this.currentPage = 1;
                        this.saveProjectsToStorage();
                    }
                },

                openCreateProjectModal() {
                    this.isEditingProject = false;
                    this.projectForm = { id: 'proj-' + Date.now(), name: '' };
                    this.showProjectModalFlag = true;
                },

                openEditProjectModal() {
                    this.isEditingProject = true;
                    this.projectForm = { id: this.currentProject.id, name: this.currentProject.name };
                    this.showProjectModalFlag = true;
                },

                saveProject() {
                    if (!this.projectForm.name.trim()) {
                        alert('請輸入專案名稱！');
                        return;
                    }
                    if (this.isEditingProject) {
                        const proj = this.projects.find(p => p.id === this.projectForm.id);
                        if (proj) proj.name = this.projectForm.name.trim();
                    } else {
                        const newProj = {
                            id: 'proj-' + Date.now(),
                            name: this.projectForm.name.trim(),
                            items: []
                        };
                        this.projects.push(newProj);
                        this.selectedProjectId = newProj.id;
                    }
                    this.saveProjectsToStorage();
                    this.showProjectModalFlag = false;
                },

                deleteProject(id) {
                    if (this.projects.length <= 1) {
                        alert('必須至少保留一個專案！');
                        return;
                    }
                    if (confirm('確定要刪除此專案及其所有檢驗項目資料嗎？此操作不可逆！')) {
                        this.projects = this.projects.filter(p => p.id !== id);
                        if (this.selectedProjectId === id) {
                            this.selectedProjectId = this.projects[0].id;
                        }
                        this.saveProjectsToStorage();
                    }
                },

                // --- 缺失項目操作 ---
                openNewItemModal() {
                    this.isEditingItem = false;
                    const seq = (this.items.length + 1).toString().padStart(2, '0');
                    this.itemForm = {
                        id: 'item-' + Date.now(),
                        code: 'A-' + seq,
                        name: '',
                        space: '客廳',
                        category: '泥作工程',
                        unit: this.unitOptions[0] || 'A1-10F',
                        method: '目視檢查',
                        repairStatus: '待修繕',
                        inspectionStatus: '待複查',
                        dueDate: '',
                        completeDate: '',
                        inspector: '',
                        remark: '',
                        defectPhotos: [],
                        repairPhotos: [],
                        inspectionPhotos: []
                    };
                    this.showItemModalFlag = true;
                },

                openEditModal(item) {
                    this.isEditingItem = true;
                    this.itemForm = JSON.parse(JSON.stringify(item));
                    this.showItemModalFlag = true;
                },

                saveItem() {
                    if (!this.itemForm.name.trim()) {
                        alert('請輸入缺失名稱說明！');
                        return;
                    }
                    if (this.isEditingItem) {
                        const idx = this.items.findIndex(i => i.id === this.itemForm.id);
                        if (idx !== -1) {
                            this.items[idx] = { ...this.itemForm };
                        }
                    } else {
                        this.items.push({ ...this.itemForm });
                    }
                    this.saveProjectsToStorage();
                    this.showItemModalFlag = false;
                },

                deleteItem(id) {
                    if (confirm('確定要刪除此筆驗屋缺失項目嗎？')) {
                        const idx = this.items.findIndex(i => i.id === id);
                        if (idx !== -1) {
                            this.items.splice(idx, 1);
                            this.saveProjectsToStorage();
                        }
                    }
                },

                onStatusOrPhotoChange(item) {
                    this.saveProjectsToStorage();
                },

                // --- 表格拖曳欄位排序 ---
                handleHeaderDragStart(e, index) {
                    this.draggedColIndex = index;
                    e.dataTransfer.effectAllowed = 'move';
                },
                handleHeaderDrop(e, index) {
                    if (this.draggedColIndex === null || this.draggedColIndex === index) return;
                    const draggedCol = this.tableColumns[this.draggedColIndex];
                    this.tableColumns.splice(this.draggedColIndex, 1);
                    this.tableColumns.splice(index, 0, draggedCol);
                    this.draggedColIndex = null;
                },

                // --- 列表長按與批量操作 ---
                startRowPress(id) {
                    this.rowPressTimer = setTimeout(() => {
                        this.batchMode = true;
                        if (!this.selectedItemIds.includes(id)) {
                            this.selectedItemIds.push(id);
                        }
                    }, 600);
                },
                cancelRowPress() {
                    if (this.rowPressTimer) clearTimeout(this.rowPressTimer);
                },
                toggleSelectAll() {
                    if (this.selectedItemIds.length === this.filteredItems.length) {
                        this.selectedItemIds = [];
                    } else {
                        this.selectedItemIds = this.filteredItems.map(i => i.id);
                    }
                },
                applyBatchSpace() {
                    if (!this.batchTargetSpace) return;
                    this.items.forEach(i => {
                        if (this.selectedItemIds.includes(i.id)) {
                            i.space = this.batchTargetSpace;
                        }
                    });
                    this.saveProjectsToStorage();
                    alert('已完成批量修改空間！');
                },
                applyBatchStatus() {
                    if (!this.batchTargetStatus) return;
                    this.items.forEach(i => {
                        if (this.selectedItemIds.includes(i.id)) {
                            i.repairStatus = this.batchTargetStatus;
                        }
                    });
                    this.saveProjectsToStorage();
                    alert('已完成批量修改修繕狀態！');
                },
                deleteBatchItems() {
                    if (confirm(`確定要刪除選取的 ${this.selectedItemIds.length} 項缺失資料嗎？`)) {
                        this.currentProject.items = this.items.filter(i => !this.selectedItemIds.includes(i.id));
                        this.selectedItemIds = [];
                        this.saveProjectsToStorage();
                    }
                },
                exitBatchMode() {
                    this.batchMode = false;
                    this.selectedItemIds = [];
                },

                // --- 圖庫模式切換 ---
                openGalleryModal() {
                    this.viewMode = 'gallery';
                    this.showGalleryModalFlag = true;
                },
                closeGalleryModal() {
                    this.showGalleryModalFlag = false;
                    this.viewMode = 'table';
                },

                // --- 照片管理 ---
                openPhotoModal(item, photoType) {
                    this.activePhotoItem = item;
                    this.activePhotoType = photoType;
                    this.showPhotoModalFlag = true;
                },
                closePhotoModal() {
                    this.showPhotoModalFlag = false;
                    this.activePhotoItem = null;
                },
                photoModalTitle() {
                    const typeMap = { defect: '【缺失照片管理】', repair: '【修繕照片管理】', inspection: '【工檢照片管理】' };
                    return typeMap[this.activePhotoType] || '照片管理';
                },
                activePhotoList() {
                    if (!this.activePhotoItem) return [];
                    return this.getPhotosByType(this.activePhotoItem, this.activePhotoType);
                },
                getPhotosByType(item, pType) {
                    if (!item) return [];
                    if (pType === 'defect') return item.defectPhotos || [];
                    if (pType === 'repair') return item.repairPhotos || [];
                    if (pType === 'inspection') return item.inspectionPhotos || [];
                    return [];
                },
                async handlePhotoUpload(event) {
                    const files = Array.from(event.target.files);
                    if (!files.length || !this.activePhotoItem) return;

                    for (let file of files) {
                        if (this.supabaseClient) {
                            try {
                                const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}_${file.name}`;
                                const { data, error } = await this.supabaseClient.storage.from('photos').upload(fileName, file);
                                if (error) throw error;
                                const { data: publicData } = this.supabaseClient.storage.from('photos').getPublicUrl(fileName);
                                this.addPhotoUrlToActiveItem(publicData.publicUrl);
                            } catch (e) {
                                console.error('Supabase 上傳失敗，改用 Base64 儲存', e);
                                const base64 = await this.readFileAsDataURL(file);
                                this.addPhotoUrlToActiveItem(base64);
                            }
                        } else {
                            const base64 = await this.readFileAsDataURL(file);
                            this.addPhotoUrlToActiveItem(base64);
                        }
                    }
                    this.saveProjectsToStorage();
                },
                readFileAsDataURL(file) {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                },
                addPhotoUrlToActiveItem(url) {
                    if (this.activePhotoType === 'defect') {
                        if (!this.activePhotoItem.defectPhotos) this.activePhotoItem.defectPhotos = [];
                        this.activePhotoItem.defectPhotos.push(url);
                    } else if (this.activePhotoType === 'repair') {
                        if (!this.activePhotoItem.repairPhotos) this.activePhotoItem.repairPhotos = [];
                        this.activePhotoItem.repairPhotos.push(url);
                    } else if (this.activePhotoType === 'inspection') {
                        if (!this.activePhotoItem.inspectionPhotos) this.activePhotoItem.inspectionPhotos = [];
                        this.activePhotoItem.inspectionPhotos.push(url);
                    }
                },
                deletePhoto(index) {
                    const list = this.activePhotoList();
                    list.splice(index, 1);
                    this.saveProjectsToStorage();
                },

                // --- PDF 匯出 ---
                openPdfExportModal() {
                    this.pdfForm.title = this.currentProjectName;
                    this.pdfForm.projectName = this.currentProjectName;
                    this.showPdfExportModalFlag = true;
                },
                togglePdfPhotoType(type) {
                    const idx = this.pdfForm.photoTypes.indexOf(type);
                    if (idx !== -1) {
                        if (this.pdfForm.photoTypes.length > 1) {
                            this.pdfForm.photoTypes.splice(idx, 1);
                        }
                    } else {
                        if (this.pdfForm.photoTypes.length >= 2) {
                            this.pdfForm.photoTypes.shift();
                        }
                        this.pdfForm.photoTypes.push(type);
                    }
                },
                exportToPdf() {
                    const element = document.getElementById('pdf-export-template');
                    if (!element) return;

                    const scaleVal = (this.pdfForm.scale / 100);
                    const opt = {
                        margin: 5,
                        filename: `${this.pdfForm.title || this.currentProjectName}_缺失報告說明書.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2 * scaleVal, useCORS: true, logging: false },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };

                    this.showPdfExportModalFlag = false;
                    html2pdf().set(opt).from(element).save();
                },

                // --- 數據統計分析 ---
                switchAnalyticsProject(projId) {
                    this.analyticsProjectId = projId;
                    this.analyticsSpace = '';
                    this.analyticsUnit = '';
                    this.analyticsCategory = '';
                }
            };
        }
    </script>
</body>
</html>
